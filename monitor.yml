name: 1111家教網新案件監控

on:
  schedule:
    # 每 5 分鐘跑一次（GitHub 的排程有時會延遲幾分鐘，屬正常現象）
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # 允許在 Actions 頁面手動點「Run workflow」測試

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 用 cache 保存 seen_cases.json，讓每次執行都記得「哪些案件已經看過」
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: seen_cases.json
          key: seen-cases-${{ github.run_id }}
          restore-keys: |
            seen-cases-

      - name: Run monitor
        env:
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_cases.json
          key: seen-cases-${{ github.run_id }}
